# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# Force full APK deployment and disable IDE optimizations that cause "None of the split APKs are compatible"
android.injected.testOnly=false
android.bundle.enableUnusedResourcesExtraction=false
android.optional.compilation.low-priority=true

# Disable "Deploy optimized APK" features at the Gradle level
android.injected.build.model.only=false
android.injected.build.model.only.advanced=false
android.injected.invoked.from.ide=false
android.injected.deployable.device.abis=armeabi-v7a,arm64-v8a,x86,x86_64
android.disallowKotlinSourceSets=false
ksp.useKSP2=true
